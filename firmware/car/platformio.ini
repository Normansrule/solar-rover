; Solar Rover - ESP32 car controller
; Build + flash:  pio run -t upload      Serial monitor:  pio device monitor
[env:car]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:scripts/embed_web.py
; exact versions: these are the ones the build was checked with
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library@3.0.2
  adafruit/Adafruit INA219@1.2.3
  pololu/VL53L0X@1.3.1
  h2zero/NimBLE-Arduino@1.4.3
  esp32async/ESPAsyncWebServer@3.6.0
  esp32async/AsyncTCP@3.3.2
  paulstoffregen/OneWire@2.3.8
  https://github.com/milesburton/Arduino-Temperature-Control-Library.git#v4.0.4
